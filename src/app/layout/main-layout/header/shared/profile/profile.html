<!-- User profile -->
<div #profileRef class="relative flex shrink-0 flex-col">
  <button
    type="button"
    aria-label="Open profile menu"
    class="
      btn btn-circle size-10 btn-ghost p-0
      sm:size-12
    "
    (click)="openedProfile() ? onCloseProfile() : onOpenProfile()"
  >
    <img
      alt=""
      src="https://img.daisyui.com/images/profile/demo/yellingcat@192.webp"
      class="rounded-full"
    />
  </button>

  <!-- User profile dropdown -->
  @if (openedProfile()) {
    <div
      class="
        absolute top-full right-0 z-9999 mt-1 flex w-63 max-w-[90vw] flex-col
        rounded-box border border-gray-500 bg-[#12464a] py-3 shadow-sm
        transition-all duration-300
      "
      [class.scale-in-tr]="!closingProfile()"
      [class.scale-out-tr]="closingProfile()"
    >
      <div class="ms-3 flex items-center gap-4">
        <img
          alt=""
          src="https://img.daisyui.com/images/profile/demo/yellingcat@192.webp"
          class="size-12 rounded-full"
        />
        <p>Rowel</p>
      </div>

      <hr class="m-3 border-t border-gray-500" />

      <ul class="mx-2 flex flex-col text-[15px]">
        <li>
          <button
            type="button"
            class="
              flex w-full cursor-pointer items-center gap-2 rounded-sm p-2
              text-left
              hover:bg-gray-500
              focus-visible:bg-gray-500 focus-visible:outline-0
            "
          >
            <svg lucideUser class="size-5"></svg>
            <span>Profile</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="
              flex w-full cursor-pointer items-center gap-2 rounded-sm p-2
              text-left
              hover:bg-gray-500
              focus-visible:bg-gray-500 focus-visible:outline-0
            "
          >
            <svg lucideSettings class="size-5"></svg>
            <span>Settings</span>
          </button>
        </li>
        <li>
          <button
            type="button"
            class="
              flex w-full cursor-pointer items-center gap-2 rounded-sm p-2
              text-left
              hover:bg-gray-500
              focus-visible:bg-gray-500 focus-visible:outline-0
            "
          >
            <svg lucideLogOut class="size-5"></svg>
            <span>Logout</span>
          </button>
        </li>
      </ul>
    </div>
  }
</div>
