<!-- User profile -->
<div #profileRef class="relative flex shrink-0 flex-col">
  <button
    type="button"
    aria-label="Open profile menu"
    class="
      btn btn-circle size-10 border border-app-background-white/25 btn-ghost p-0
      hover:border-app-background-white/40 hover:bg-transparent hover:shadow-none
      sm:size-12
    "
    (click)="openedProfile() ? onCloseProfile() : onOpenProfile()"
  >
    @if (photoUrl(); as photo) {
      <img alt="" [src]="photo" class="size-full rounded-full object-cover" />
    } @else {
      <svg lucideUser class="size-6" aria-hidden="true"></svg>
    }
  </button>

  <!-- User profile dropdown -->
  @if (openedProfile()) {
    <div
      class="
        absolute top-full right-0 z-9999 mt-1 flex w-63 max-w-[90vw] flex-col
        rounded-box border border-gray-500 bg-[#12464a] py-3 shadow-sm
        transition-all duration-300
      "
      [class.scale-in-tr]="!closingProfile()"
      [class.scale-out-tr]="closingProfile()"
    >
      <div class="ms-3 flex items-center gap-4">
        @if (photoUrl(); as photo) {
          <img alt="" [src]="photo" class="size-12 rounded-full object-cover" />
        } @else {
          <span class="
            flex size-12 items-center justify-center rounded-full bg-gray-600
          ">
            <svg lucideUser class="size-6" aria-hidden="true"></svg>
          </span>
        }
        @let userDisplayName = userService.getDisplayName();
        @if (userDisplayName !== undefined) {
          <p class="
            text-sm
            sm:text-base
          ">{{ userDisplayName }}</p>
        }
      </div>

      <hr class="m-3 border-t border-gray-500" />

      <ul class="mx-2 flex flex-col text-[15px]">
        <li>
          <a
            routerLink="/profile"
            (click)="onCloseProfile()"
            class="
              flex w-full cursor-pointer items-center gap-2 rounded-sm p-2
              text-left
              hover:bg-gray-500
              focus-visible:bg-gray-500 focus-visible:outline-0
            "
          >
            <svg lucideUser class="size-5"></svg>
            <span>Profile</span>
          </a>
        </li>

        <li>
          <a
            routerLink="/settings"
            (click)="onCloseProfile()"
            class="
              flex w-full cursor-pointer items-center gap-2 rounded-sm p-2
              text-left
              hover:bg-gray-500
              focus-visible:bg-gray-500 focus-visible:outline-0
            "
          >
            <svg lucideSettings class="size-5"></svg>
            <span>Settings</span>
          </a>
        </li>

        <li>
          <button
            type="button"
            class="
              flex w-full cursor-pointer items-center gap-2 rounded-sm p-2
              text-left
              hover:bg-gray-500
              focus-visible:bg-gray-500 focus-visible:outline-0
            "
          >
            <svg lucideLogOut class="size-5"></svg>
            <span>Logout</span>
          </button>
        </li>
      </ul>
    </div>
  }
</div>
