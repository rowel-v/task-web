<div class="relative flex h-dvh bg-app-background-green text-app-text-white">
  <app-sidebar [(open)]="openSideNav" />

  <main class="flex min-w-0 flex-1 flex-col">
    <!-- Header -->
    @switch (currentHeader()) {
      @case ('home') {
        <app-overview-header (openSideNav)="onOpenSideNav()" />
      }
      @case ('tasks') {
        <app-task-header (openSideNav)="onOpenSideNav()" />
      }
      @case ('settings') {
        <app-settings-header (openSideNav)="onOpenSideNav()" />
      }
    }

    <!-- Content -->
    <div class="
      min-h-0 flex-1 overflow-y-auto
      sm:mx-2
    ">
      <router-outlet />
    </div>
  </main>
</div>
