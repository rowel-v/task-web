<div class="flex flex-col items-center justify-center py-16 text-center">
  <mat-icon class="mb-4 h-16! w-16! text-6xl! text-gray-400"> task_alt </mat-icon>

  <h2 class="text-xl font-semibold text-gray-800">No tasks yet</h2>

  <p class="mt-2 max-w-sm text-gray-500">
    You don't have any tasks yet. Create your first task to get started.
  </p>

  <button (click)="createTask.emit()" mat-raised-button color="primary" class="mt-6">
    <mat-icon>add</mat-icon>
    Create Task
  </button>
</div>
