<div class="flex items-start justify-between">
  <div class="flex flex-col gap-1">
    <p class="text-2xl font-bold">{{ title() }}</p>
    @if (subTitle()) {
      <p>{{ subTitle() }}</p>
    }
  </div>
  <app-button class="-me-2 -mt-2" variant="close" [unclickable]="disableCloseButton()" (pressed)="closed.emit()" />
</div>
