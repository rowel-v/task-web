@let longTitle = title().length > 21;

<div class="flex items-start justify-between px-6 pt-6 pb-4">
  <div class="flex-1 min-w-0">
    @if (longTitle) {
      <p class="text-lg font-bold">{{ title() | titlecase }}</p>
    } @else {
      <p class="text-2xl font-bold">{{ title() | titlecase }}</p>
    }
  </div>
  <div class="flex items-center shrink-0">
    <app-tasks-status-badge class="mx-3" [status]="status()" />
    <app-close-button [unclickable]="isLoading()" (closed)="closed.emit()" />
  </div>
</div>
