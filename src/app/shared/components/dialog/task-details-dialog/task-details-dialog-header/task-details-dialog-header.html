<div class="flex items-start justify-between px-6 pt-6 pb-4 font-sora">
  <div class="min-w-0 flex-1">
    <p class="text-lg font-bold">{{ title() | titlecase }}</p>
  </div>
  <div class="flex shrink-0 items-center">
    <app-tasks-status-badge class="mx-3" [status]="status()" />
    <app-button variant="close" [unclickable]="disableCloseButton()" (pressed)="closed.emit()" />
  </div>
</div>
