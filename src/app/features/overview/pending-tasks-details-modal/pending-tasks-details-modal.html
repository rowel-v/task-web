<!-- Invisible backdrop, covers the entire viewport and catches clicks outside the modal. -->
<div #backDrop class="fixed inset-0 z-9998 cursor-default"></div>

<!-- Modal container, positioned beside the Pending Tasks stat. -->
<div
  class="absolute top-0 left-full z-9999 ml-2 cursor-default"
  [class.scale-in-tl]="!isClosing()"
  [class.scale-out-tl]="isClosing()"
>
  <!-- Modal content -->
  <div
    class="
      flex h-72 w-80 flex-col rounded-xl bg-app-background-white p-5
      text-app-background-green shadow-xl
    "
  >
    <!-- Header -->
    <div class="mb-4 flex justify-between">
      <h2 class="text-lg font-bold">Pending Tasks</h2>
      <!-- Close button -->
      @if (selectedCategory() === null) {
        <button
          class="
            cursor-pointer rounded-sm
            hover:bg-app-background-hover
            focus-visible:bg-app-background-hover focus-visible:outline-0
          "
          [class.rotate-in-center]="true"
          (click)="closeModal()"
        >
          <svg lucideX />
        </button>
      } @else {
        <button
          #backBtn
          class="
            cursor-pointer rounded-sm
            hover:bg-app-background-hover
            focus-visible:bg-app-background-hover focus-visible:outline-0
          "
          [class.rotate-in-center]="true"
          (click)="selectCategory(null)"
        >
          <svg lucideArrowLeft />
        </button>
      }
    </div>

    <!-- Content -->
    <div class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto">
      @switch (selectedCategory()) {
        @case ('pending') {
          <app-task-details-list
            [isEnteringDetail]="true"
            [tasks]="pendingTasks()"
            icon="pending"
            iconWhenEmpty="check_circle"
            titleWhenEmpty="No pending tasks"
            descriptionWhenEmpty="All your tasks are completed."
          />
        }
        @case ('high_priority') {
          <app-task-details-list
            [isEnteringDetail]="true"
            [tasks]="pendingHighPriority()"
            icon="high_priority"
            iconWhenEmpty="check_circle"
            titleWhenEmpty="No high-priority tasks"
            descriptionWhenEmpty="Nothing urgent needs your attention."
          />
        }
        @case ('due_today') {
          <app-task-details-list
            [isEnteringDetail]="true"
            [tasks]="pendingDueToday()"
            icon="due_today"
            iconWhenEmpty="check_circle"
            titleWhenEmpty="No tasks due today"
            descriptionWhenEmpty="You're all caught up for today."
          />
        }
        @case ('overdue') {
          <app-task-details-list
            [isEnteringDetail]="true"
            [tasks]="overdueTasks()"
            icon="overdue"
            iconWhenEmpty="check_circle"
            titleWhenEmpty="No overdue tasks"
            descriptionWhenEmpty="You're up to date with your tasks."
          />
        }
        @default {
          <!-- Task breakdown -->
          <ul class="space-y-3" [class.slide-in-left]="isReturning()">
            @for (c of categories(); track c.key) {
              <li>
                <button
                  type="button"
                  class="
                    flex w-full cursor-pointer items-center justify-between
                    rounded-lg p-2 text-left transition-colors duration-200
                    hover:bg-app-background-hover
                    focus-visible:bg-app-background-hover
                    focus-visible:outline-0
                  "
                  (click)="selectCategory(c.key)"
                >
                  <span class="flex items-center gap-2">
                    @switch (c.key) {
                      @case ('pending') {
                        <svg lucideClock5 />
                      }
                      @case ('high_priority') {
                        <svg lucideFlagTriangleRight />
                      }
                      @case ('due_today') {
                        <svg lucideAlarmClock />
                      }
                      @case ('overdue') {
                        <svg lucideTriangleAlert />
                      }
                    }
                    <span>{{ c.label }}</span>
                  </span>
                  <span class="font-semibold">{{ c.count }}</span>
                </button>
              </li>
            }
          </ul>
        }
      }
    </div>
  </div>
</div>
