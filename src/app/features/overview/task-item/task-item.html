@let t = task();

<button
  type="button"
  class="
    group flex w-full cursor-pointer items-center gap-4 rounded-sm p-4 text-left
    text-app-text-white transition
    hover:bg-app-button-hover-gray
    focus-visible:bg-app-button-hover-gray focus-visible:outline-0
    active:bg-app-button-hover-gray
  "
  (click)="pressed.emit()"
>
  <!-- Task information -->
  <span class="min-w-0 flex-1">
    <span class="block truncate font-medium" [class.line-through]="isCompleted()">
      {{ t.name }}
    </span>

    @if (t.description) {
      <span class="mt-1 block truncate text-sm">
        {{ t.description }}
      </span>
    }
  </span>

  <!-- Status -->
  <app-tasks-status-badge [status]="t.status" />
</button>
