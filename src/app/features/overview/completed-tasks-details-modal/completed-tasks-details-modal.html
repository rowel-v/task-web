<!-- Invisible backdrop, covers the entire viewport and catches clicks outside the modal. -->
<div #backDrop class="fixed inset-0 z-9998 cursor-default"></div>

<!-- Modal container, positioned beside the Completed Tasks stat (centered on mobile). -->
<div
  class="
    absolute top-0 right-full z-9999 mr-2 cursor-default
    max-md:fixed max-md:inset-0 max-md:m-auto max-md:size-fit
  "
  [class.scale-in-tl]="!isClosing() && !isMobile()"
  [class.scale-out-tl]="isClosing() && !isMobile()"
  [class.scale-in-center]="!isClosing() && isMobile()"
  [class.scale-out-center]="isClosing() && isMobile()"
>
  <!-- Modal content -->
  <div
    class="
      flex h-72 w-80 flex-col rounded-xl bg-app-background-white p-5
      text-app-background-green shadow-xl
      max-md:max-w-[90vw]
    "
  >
    <!-- Header -->
    <div class="mb-4 flex justify-between">
      <h2 class="text-lg font-bold">Completed Tasks</h2>
      <!-- Close button -->
      @if (selectedCategory() === null) {
        <button
          animate.enter="rotate-in-center"
          class="
            cursor-pointer rounded-sm
            hover:bg-app-background-hover
            focus-visible:bg-app-background-hover focus-visible:outline-0
            active:bg-app-background-hover
          "
          (click)="closeModal()"
        >
          <svg lucideX />
        </button>
      } @else {
        <button
          #backBtn
          animate.enter="rotate-in-center"
          class="
            cursor-pointer rounded-sm
            hover:bg-app-background-hover
            focus-visible:bg-app-background-hover focus-visible:outline-0
            active:bg-app-background-hover
          "
          (click)="selectCategory(null)"
        >
          <svg lucideArrowLeft />
        </button>
      }
    </div>

    <!-- Content -->
    <div class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto">
      @switch (selectedCategory()) {
        @case ('completed') {
          <app-task-details-list
            [isEnteringDetail]="true"
            [tasks]="completedTasks()"
            icon="completed"
            iconWhenEmpty="task_alt"
            titleWhenEmpty="No completed tasks"
            descriptionWhenEmpty="You haven't completed any tasks yet."
          />
        }
        @case ('high_priority') {
          <app-task-details-list
            [isEnteringDetail]="true"
            [tasks]="completedHighPriority()"
            icon="high_priority"
            iconWhenEmpty="check_circle"
            titleWhenEmpty="No high-priority tasks"
            descriptionWhenEmpty="You haven't completed any high-priority tasks yet."
          />
        }
        @case ('completed_today') {
          <app-task-details-list
            [isEnteringDetail]="true"
            [tasks]="completedToday()"
            icon="completed_today"
            iconWhenEmpty="check_circle"
            titleWhenEmpty="No tasks completed today"
            descriptionWhenEmpty="You haven't completed any tasks today yet."
          />
        }
        @case ('completed_this_week') {
          <app-task-details-list
            [isEnteringDetail]="true"
            [tasks]="completedThisWeek()"
            icon="completed_this_week"
            iconWhenEmpty="check_circle"
            titleWhenEmpty="No tasks completed this week"
            descriptionWhenEmpty="You haven't completed any tasks this week yet."
          />
        }
        @default {
          <!-- Task breakdown -->
          <ul class="space-y-3" [class.slide-in-left]="isReturning()">
            @for (c of categories(); track c.key) {
              <li>
                <button
                  type="button"
                  class="
                    flex w-full cursor-pointer items-center justify-between
                    rounded-lg p-2 text-left transition-colors duration-200
                    hover:bg-app-background-hover
                    focus-visible:bg-app-background-hover
                    focus-visible:outline-0
                    active:bg-app-background-hover
                  "
                  (click)="selectCategory(c.key)"
                >
                  <span class="flex items-center gap-2">
                    @switch (c.key) {
                      @case ('completed') {
                        <svg lucideCircleCheck />
                      }
                      @case ('high_priority') {
                        <svg lucideFlagTriangleRight />
                      }
                      @case ('completed_today') {
                        <svg lucideBadgeCheck />
                      }
                      @case ('completed_this_week') {
                        <svg lucideCalendarCheck />
                      }
                    }
                    <span>{{ c.label }}</span>
                  </span>
                  <span class="font-semibold">{{ c.count }}</span>
                </button>
              </li>
            }
          </ul>
        }
      }
    </div>
  </div>
</div>
