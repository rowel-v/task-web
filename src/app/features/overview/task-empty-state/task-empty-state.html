<div class="flex items-center justify-center py-12">
  <img src="images/stick-man-empty-today-tasks.png" alt="No Tasks" />

  <div class="flex flex-col">
    <p class="text-md italic">You don't have any tasks</p>
    <p class="text-md italic">assigned for today.</p>

    <button
      class="
        btn mt-4 size-fit border-none bg-app-button-purple shadow-none btn-sm
        focus-within:bg-app-button-hover-gray focus-within:outline-0
        hover:bg-app-button-hover-gray
      "
      (click)="pressedAddTaskBtn.emit()"
    >
      <svg lucidePlus />
      <span class="
        hidden
        sm:inline
      ">Add Task</span>
    </button>
  </div>
</div>
