<div class="mx-auto w-full h-full flex flex-col text-app-text-white">
  <!--All-->
  <div class="tabs tabs-border gap-1 mb-3">
    <label class="tab gap-1 text-[15px]" (click)="selectedTab.set('all')">
      <input type="radio" name="my_tabs_4" checked="checked" />
      <svg lucideClipboardList />
      All
    </label>
    <!--Pending-->
    <label class="tab gap-1 text-[15px]" (click)="selectedTab.set('pending')">
      <input type="radio" name="my_tabs_4" />
      <svg lucideClock5 />
      Pending
    </label>
    <!--In progress-->
    <label class="tab gap-1 text-[15px]" (click)="selectedTab.set('in_progress')">
      <input type="radio" name="my_tabs_4" />
      <svg lucideCircleEllipsis />
      In Progress
    </label>
    <!--Completed-->
    <label class="tab gap-1 text-[15px]" (click)="selectedTab.set('completed')">
      <input type="radio" name="my_tabs_4" />
      <svg lucideCircleCheck />
      Completed
    </label>
  </div>

  <div class="flex flex-col overflow-y-auto">
    @for (todo of todosToDisplay(); track todo.id) {
      <div
        class="flex items-center cursor-pointer hover:bg-app-button-hover-gray p-4 rounded-md"
        (click)="selectedModal.set('todo-details-dialog'); selectedTodo.set(todo)"
      >
        <div class="flex flex-col">
          <p class="text-[18px] font-medium">{{ todo.name | titlecase }}</p>
          <p class="mt-2 italic">{{ todo.description }}</p>
          <div class="flex gap-3 mt-3">
            <app-tasks-status-badge [status]="todo.status" />
            <p class="font-extralight">Due: {{ todo.duedate | date: 'medium' }}</p>
          </div>
        </div>
      </div>
    } @empty {
      <div class="bg flex flex-col items-center justify-center h-screen overflow-hidden">
        <img
          [src]="emptyState().image"
          alt="Empty state"
          width="400"
          height="400"
          class="object-contain max-w-full max-h-full"
          [class]="emptyState().imageWidth"
        />
        <p class="text-[18px] italic font-extralight">{{ emptyState().message }}</p>
      </div>
    }
  </div>
</div>

@if (selectedModal() === 'todo-details-dialog' && selectedTodo(); as todo) {
  <app-task-details-dialog [todo]="todo" (closed)="closeModal()" [isClosing]="closedModal()" />
}
