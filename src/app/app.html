<!-- Current page -->
<router-outlet />

@if (fetchStatus() === 'FETCHING') {
  <!-- Loading overlay: blurs the page while the first task fetch runs -->
  <app-loading-overlay />
} @else if (fetchStatus() === 'FAILED') {
  <!-- Error screen with a retry button -->
  <app-server-error (retried)="onRetry()" />
}

<!--shows the toast messages in the template-->
<app-notification-toast />
